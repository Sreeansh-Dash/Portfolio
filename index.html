    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1a1a1a",

              "accent-blue": "#3b82f6",
              "sticky-yellow": "#fef08a",
              "bookmark-red": "#b91c1c",
              "wax-red": "#991b1b",
              // Semantic tokens (auto dark-mode via CSS custom properties)
              "page": "var(--color-bg-primary)",
              "surface": "var(--color-bg-secondary)",
              "panel": "var(--color-bg-tertiary)",
              "ink": "var(--color-text-primary)",
              "muted": "var(--color-text-secondary)",
              "accent-warm": "var(--color-text-accent)",
            },
            fontFamily: {
              display: ["'Playfair Display'", "serif"],
              body: ["'Lato'", "sans-serif"],
              sans: ["'Inter'", "sans-serif"],
              serif: ["'Cormorant Garamond'", "serif"],
              handwriting: ["'Reenie Beanie'", "cursive"],
              cursive: ["'Great Vibes'", "cursive"],
              caveat: ["'Caveat'", "cursive"],
              belle: ["'La Belle Aurore'", "cursive"],
            },
            boxShadow: {
              'book': '0 20px 50px -12px rgba(0, 0, 0, 0.25)',
              'spine-center': 'inset -30px 0 40px -20px rgba(0,0,0,0.15), inset 30px 0 40px -20px rgba(0,0,0,0.15)',
              'spine-left': 'inset -15px 0 20px -10px rgba(0,0,0,0.1)',
              'spine-right': 'inset 15px 0 20px -10px rgba(0,0,0,0.1)',
              'paper-menu': '0 10px 30px -5px rgba(0, 0, 0, 0.3)',
              'polaroid': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
            },
            backgroundImage: {
               'paper-texture': "url('https://www.transparenttextures.com/patterns/cream-paper.png')",

        },
      };

    <style>
      /* Semantic color tokens — auto-switch via .dark class */
      :root {
        --color-bg-primary: #F8F4EA;
        --color-bg-secondary: #E3E8DD;
        --color-bg-tertiary: #E6DCC6;
        --color-text-primary: #1F1B16;
        --color-text-secondary: #6B6356;
        --color-text-accent: #A6432F;
      }
      .dark {
        --color-bg-primary: #1A1816;
        --color-bg-secondary: #1C1F26;
        --color-bg-tertiary: #2A2622;
        --color-text-primary: #F2EDE2;
        --color-text-secondary: #A89E8E;
        --color-text-accent: #D98E5C;
      }

      /* Hidden scrollbars — preserving the book aesthetic */
      .custom-scrollbar {
          -ms-overflow-style: none;  /* IE / Edge */
          scrollbar-width: none;     /* Firefox */
      }
      .custom-scrollbar::-webkit-scrollbar {
          display: none;             /* Chrome / Safari / Opera */
      }

      /* Scroll hint: soft bottom-edge fade — signals more content without a scrollbar */
      .scroll-hint-container {
          position: relative;
      }
      .scroll-hint-container::after {
          content: '';
          position: sticky;
          bottom: 0;
          left: 0;
          right: 0;
          height: 36px;
          background: linear-gradient(to top, var(--color-bg-primary), transparent);
          pointer-events: none;
          display: block;
          z-index: 10;
          flex-shrink: 0;
      }
      .spine-shadow-overlay {
          background: linear-gradient(to right, 
              rgba(0,0,0,0.05) 0%, 
              rgba(0,0,0,0.15) 45%, 
              rgba(0,0,0,0.2) 50%, 
              rgba(0,0,0,0.15) 55%, 
              rgba(0,0,0,0.05) 100%);
      }
      .dark .spine-shadow-overlay {
          background: linear-gradient(to right, 
              rgba(0,0,0,0.4) 0%, 
              rgba(0,0,0,0.6) 45%, 
              rgba(0,0,0,0.8) 50%, 
              rgba(0,0,0,0.6) 55%, 
              rgba(0,0,0,0.4) 100%);
      }
      .wax-seal {
          background: radial-gradient(circle at 30% 30%, #dc2626, #991b1b, #7f1d1d);
          box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 2px 2px 4px rgba(255,255,255,0.4), inset -2px -2px 4px rgba(0,0,0,0.2);
      }

      /* Ink Writing Effect */
      .ink-reveal {
          clip-path: inset(0 100% 0 0);
          animation: ink-draw 2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
          will-change: clip-path;
      }
      @keyframes ink-draw {
          to { clip-path: inset(0 0 0 0); }
      }

      /* Slow fade for paragraphs to look like ink soaking in */
      .ink-soak {
          opacity: 0;
          animation: soak-in 2s ease-out forwards;
      }
      @keyframes soak-in {
          to { opacity: 1; }
      }
      
      /* Gentle scale and fade for cards/elements */
      .fade-scale {
          opacity: 0;
          transform: scale(0.98);
          animation: fade-scale-in 0.8s ease-out forwards;
      }
      @keyframes fade-scale-in {
          to { opacity: 1; transform: scale(1); }
      }

      /* MistakeText Cursor Styling */
      @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
      }
      .mistake-cursor {
          animation: blink 0.8s step-end infinite;
          font-family: 'Reenie Beanie', cursive;
          font-weight: bold;
          color: #3b82f6; /* accent blue */
          margin-left: 2px;
          display: inline-block;
      }
      .dark .mistake-cursor {
          color: #60a5fa; /* lighter accent blue for dark mode */
      }
    </style>
